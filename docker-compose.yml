# Infra de développement MapSmart.
# PostGIS est requis ; Redis sert aux files d'attente (Horizon) ; Valhalla est optionnel (isochrones).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mapsmart
      POSTGRES_USER: mapsmart
      POSTGRES_PASSWORD: mapsmart
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Files d'attente (Horizon) : ingestion DVF / cadastre.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Isochrones (temps/distance) — Valhalla auto-hébergé (instance publique interdite en usage commercial).
  # Au premier lancement : télécharge l'extrait OSM de la région et construit les tuiles
  # de routage dans ./valhalla_tiles (10-30 min selon la machine), puis les réutilise.
  # Lancer avec : docker compose --profile routing up -d valhalla
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    profiles: ["routing"]
    ports:
      - "8002:8002"
    environment:
      # Région couverte : à élargir (plusieurs URLs séparées par des virgules) selon le périmètre client.
      tile_urls: ${VALHALLA_PBF_URLS:-https://download.geofabrik.de/europe/france/centre-latest.osm.pbf}
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      serve_tiles: "True"
      force_rebuild: "False"
    volumes:
      - ./valhalla_tiles:/custom_files

volumes:
  db_data:
  redis_data:
